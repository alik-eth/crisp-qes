app = "civicvoice"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_CHAIN_ID = "84532"
    VITE_RPC_URL = "https://base-sepolia-rpc.publicnode.com"
    VITE_OPRF_URL = "https://crisp-qes-oprf.fly.dev"
    # Full v2 stack redeployed 2026-06-02 (clean-slate EnrollmentRegistry with
    # genesisLeafCount=0 + zero-tree genesisRoot, fresh UltraVerifierV2 +
    # PetitionRegistryV2 immutably bound to it). Verifier 0xe7a4...DaFF67 is held
    # internally by PetitionRegistryV2; the SIGN-circuit VK is unchanged.
    VITE_ENROLLMENT_REGISTRY = "0x5F463C130DB79e70c3861879442857c45953505f"
    VITE_PETITION_REGISTRY_V2 = "0x1674afeb44d02d08cdbf909a39EA676b81642dCB"
    VITE_RELAYER_URL = "https://crisp-qes-relayer.fly.dev"
    VITE_CIRCUIT_URL = "/crisp_qes_v2_circuit.json"
    VITE_BLOCK_EXPLORER = "https://sepolia.basescan.org"
    VITE_WALLETCONNECT_PROJECT_ID = "33a263ffda20d72b289cf92b369cfa47"
    # v2.1: pin K_pub at build time so a MITM running its own (K_pub*, k*)
    # can't pass DLEQ against a spoofed pubkey served from /healthz. v2.2
    # moves this onto EnrollmentRegistry as `bytes32 oprfPubkey` and the
    # client reads from chain.
    VITE_OPRF_PUBKEY = "0xbe42b0024b2e4ee2483021fefbf40a5bec6f51fe08d35237027a667712694456"
    # Must match the OPRF service's OPRF_ENROLLMENT_EPOCH byte-for-byte
    # (#29 / #33). Rotate in lockstep with OPRF_KEY rotations.
    VITE_OPRF_ENROLLMENT_EPOCH = "v2-2026"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
