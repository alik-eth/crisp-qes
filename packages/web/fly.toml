app = "crisp-qes-v2-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

  # NOTE: addresses + URLs marked TBD are filled in by tasks N2/N3/N5.
  # The build still succeeds with the placeholders — they just produce a
  # non-functional integration until the deps land.
  [build.args]
    VITE_CHAIN_ID = "84532"
    VITE_RPC_URL = "https://sepolia.base.org"
    VITE_OPRF_URL = "https://crisp-qes-v2-oprf.fly.dev"
    # Addresses from packages/contracts/deployments/base-sepolia.json
    # (deployer commit 486cb0d, 2026-05-29). The initial 7a78c86 deploy
    # used a bytes24 digest scheme that didn't match the backend signer;
    # superseded contracts are documented in the same JSON file and will
    # never accept attesterSig from the live OPRF service.
    VITE_ENROLLMENT_REGISTRY = "0x4A17285f2f3035AD8bB6da86d9aB189cC33c4106"
    VITE_PETITION_REGISTRY_V2 = "0x11561749D669791117592332B8E5373Ff60406EF"
    VITE_RELAYER_URL = "https://crisp-qes-v2-relayer.fly.dev"
    VITE_CIRCUIT_URL = "/crisp_qes_v2_circuit.json"
    VITE_BLOCK_EXPLORER = "https://sepolia.basescan.org"
    VITE_WALLETCONNECT_PROJECT_ID = "33a263ffda20d72b289cf92b369cfa47"
    # v2.1: pin K_pub at build time so a MITM running its own (K_pub*, k*)
    # can't pass DLEQ against a spoofed pubkey served from /healthz. v2.2
    # moves this onto EnrollmentRegistry as `bytes32 oprfPubkey` and the
    # client reads from chain.
    VITE_OPRF_PUBKEY = "0xbe42b0024b2e4ee2483021fefbf40a5bec6f51fe08d35237027a667712694456"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
