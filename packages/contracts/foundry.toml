[profile.default]
src = "src"
out = "out"
libs = ["../contracts/lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1
via_ir = false
evm_version = "cancun"
# Read access for the bench harness — UltraVerifierV2Gas.t.sol loads a
# proof blob from `bench/` produced by `node bench/v2-emit-proof.mjs`.
fs_permissions = [{ access = "read", path = "../../bench" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base         = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
base         = { key = "${BASESCAN_API_KEY}", chain = 8453 }
