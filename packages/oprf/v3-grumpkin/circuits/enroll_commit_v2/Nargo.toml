[package]
name = "enroll_commit_v2"
type = "bin"
authors = ["crisp-qes"]
compiler_version = ">=1.0.0"

[dependencies]
# Portable dependency. Was an absolute local path
# (/home/alikvovk/nargo/github.com/noir-lang/sha256/v0.3.0) that broke CI and
# other checkouts. Now points at a vendored copy of noir-lang/sha256 v0.3.0
# committed under v3-grumpkin/vendor/sha256 (relative path => no network or
# per-machine nargo cache needed at build time). v0.3.0 is the tag that builds
# with nargo 1.0.0-beta.19.
sha256 = { path = "../../vendor/sha256" }
# Reusable Grumpkin VOPRF library: pins GEN (F1) + SvdW c1..c4 (F3), limb-binds
# the DLEQ challenge (C-1), range-checks limbs (C-3), and enforces the single-r
# F2 blind<->unblind binding. The OPRF tail of main() composes this lib.
grumpkin_voprf = { path = "../../lib-noir/grumpkin_voprf" }
