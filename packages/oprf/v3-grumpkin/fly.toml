app = "crisp-qes-oprf-grumpkin"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8788"
  # bb.js verifier CRS is baked into the image at /app/.bb-crs (no runtime fetch).
  CRS_PATH = "/app/.bb-crs"
  BB_BACKEND = "Wasm"
  BB_THREADS = "1"
  CHAIN_ID = "11155111"
  # Fresh clean-slate EnrollmentRegistry (genesis, leafCount 0) — the attester
  # digest pins this address, so the v3 service's genesis tree matches on-chain.
  ENROLLMENT_REGISTRY = "0xC9b35dE202e0Bf92e38603deEC4176557eF249a4"
  # GRUMPKIN_OPRF_KEY (32-byte hex node secret) is REQUIRED in production and is
  # set via `flyctl secrets set GRUMPKIN_OPRF_KEY=...`, NOT here.

[http_service]
  internal_port = 8788
  force_https = true
  # Keep the machine WARM: the Merkle store is in-memory (genesis on boot), so a
  # restart after enrollments would desync from the advanced on-chain root.
  # Staying always-on preserves the tree across the demo. (Robust fix = sync the
  # store from on-chain CommitmentInserted events on boot — deferred.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # bb.js wasm/NAPI verifier needs more headroom than the v2 ristretto node;
  # 1GB keeps UltraHonk verification comfortable on a shared-cpu VM.
  memory_mb = 2048
