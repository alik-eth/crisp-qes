app = "crisp-qes-v2-relayer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8789"
  CHAIN_ID = "84532"
  RPC_URL = "https://sepolia.base.org"
  PETITION_REGISTRY_V2 = "0xe7cC90F3E4d70e47D1d35DCDF820C3B1c27aE8Cd"
  ENROLLMENT_REGISTRY = "0x66573066C9e5f87cF63c9607BD1e75d9831850aA"
  BLOCK_EXPLORER_BASE = "https://sepolia.basescan.org/tx/"
  RATE_LIMIT_WINDOW_MS = "10000"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
