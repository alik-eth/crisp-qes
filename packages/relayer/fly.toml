app = "crisp-qes-relayer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8789"
  CHAIN_ID = "11155111"
  RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
  PETITION_REGISTRY_V2 = "0xBeaCa3c58ebb0476aAc8180E7428eD01E9367295"
  ENROLLMENT_REGISTRY = "0x92b54725CECb48Fb988c08C6AeC861d1861beE24"
  BLOCK_EXPLORER_BASE = "https://sepolia.etherscan.io/tx/"
  RATE_LIMIT_WINDOW_MS = "10000"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
