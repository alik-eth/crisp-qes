app = "crisp-qes-relayer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8789"
  CHAIN_ID = "84532"
  RPC_URL = "https://base-sepolia-rpc.publicnode.com"
  # Repointed 2026-06-02 to the clean-slate full-stack redeploy (genesisLeafCount=0).
  # The relayer submits updateRoot to ENROLLMENT_REGISTRY; the attester sig is
  # bound to address(this), so this MUST match the service's signing address
  # (0x5F46..) or updateRoot reverts BadSignature.
  PETITION_REGISTRY_V2 = "0x1674afeb44d02d08cdbf909a39EA676b81642dCB"
  ENROLLMENT_REGISTRY = "0x5F463C130DB79e70c3861879442857c45953505f"
  BLOCK_EXPLORER_BASE = "https://sepolia.basescan.org/tx/"
  RATE_LIMIT_WINDOW_MS = "10000"
  # Frontend renamed crisp-qes-web -> civicvoice; allow both origins for /v2/* CORS.
  CORS_ALLOWED_ORIGINS = "https://civicvoice.fly.dev,https://crisp-qes-web.fly.dev"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
