app = "crisp-qes-relayer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8789"
  CHAIN_ID = "84532"
  RPC_URL = "https://base-sepolia-rpc.publicnode.com"
  PETITION_REGISTRY_V2 = "0x6b0C722fa50F6325028781DC5A25e9beC1fE4a89"
  ENROLLMENT_REGISTRY = "0xC48d5e645f569b5Cd9E1C315f4344DF85e09CFBa"
  BLOCK_EXPLORER_BASE = "https://sepolia.basescan.org/tx/"
  RATE_LIMIT_WINDOW_MS = "10000"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
