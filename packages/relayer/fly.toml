app = "crisp-qes-relayer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8789"
  CHAIN_ID = "11155111"
  RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
  PETITION_REGISTRY_V2 = "0x19f7d9eb732e0747b252aab0402296fe6c988894"
  ENROLLMENT_REGISTRY = "0x33958a305EBD45Af5FC11eCaeBf5f9A90DE7Af0D"
  BLOCK_EXPLORER_BASE = "https://sepolia.etherscan.io/tx/"
  RATE_LIMIT_WINDOW_MS = "10000"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
