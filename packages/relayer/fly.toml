app = "crisp-qes-relayer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8789"
  CHAIN_ID = "84532"
  RPC_URL = "https://base-sepolia-rpc.publicnode.com"
  PETITION_REGISTRY_V2 = "0x4c6b7Da31dDb645A26F821f44DD44ecF3cd7000A"
  ENROLLMENT_REGISTRY = "0x64f40F22033E0AdB0c1183c42135e5C29266b817"
  BLOCK_EXPLORER_BASE = "https://sepolia.basescan.org/tx/"
  RATE_LIMIT_WINDOW_MS = "10000"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
