name: Deploy to Fly

# Redeploy each Fly app on push to main — but only the apps whose files changed.
#
# Build contexts (from each Dockerfile):
#   - web / relayer / oprf-v2  -> repo root  (COPY pnpm-lock.yaml, packages/...)
#
# NOT auto-deployed here:
#   - oprf-v3 (crisp-qes-oprf-grumpkin): its Dockerfile COPYs pre-built Noir
#     circuit artifacts (circuits/*/target/*.json + proofs) that are gitignored
#     build outputs, absent from a fresh CI checkout. Deploy it manually after
#     rebuilding circuits, or add a nargo+bb compile step before re-enabling it.
#
# Requires repo secret FLY_API_TOKEN (a Fly deploy/org token).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      relayer: ${{ steps.filter.outputs.relayer }}
      oprf_v2: ${{ steps.filter.outputs.oprf_v2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'packages/web/**'
              - 'packages/sdk/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            relayer:
              - 'packages/relayer/**'
              - 'pnpm-lock.yaml'
            # oprf-v2 builds from its own TS source + sdk + lotl-flattener.
            # Enumerate concrete paths (no '!' negation: in paths-filter a bare
            # '!glob' matches every file OUTSIDE the glob, which fired oprf_v2 on
            # unrelated changes). v3-grumpkin lives under packages/oprf/ but is a
            # separate app, so it is intentionally excluded by not listing it.
            oprf_v2:
              - 'packages/oprf/src/**'
              - 'packages/oprf/Dockerfile'
              - 'packages/oprf/fly.toml'
              - 'packages/oprf/package.json'
              - 'packages/oprf/tsconfig.json'
              - 'packages/sdk/**'
              - 'packages/lotl-flattener/**'
              - 'pnpm-lock.yaml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config packages/web/fly.toml --dockerfile packages/web/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  relayer:
    needs: changes
    if: needs.changes.outputs.relayer == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-relayer
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config packages/relayer/fly.toml --dockerfile packages/relayer/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  oprf_v2:
    needs: changes
    if: needs.changes.outputs.oprf_v2 == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-oprf-v2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config packages/oprf/fly.toml --dockerfile packages/oprf/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
