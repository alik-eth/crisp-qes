# Fully-local CRISP-QES: enroll with a real Diia QES + cast an in-browser vote,
# offline. All built from source (includes the coordinator-CORS + OPRF ?root
# fixes). Real QES works against the OPRF's DEFAULT enroll gate (pins real Diia
# CAs). See docs/runbooks/docker-compose-dev.md.
#
#   docker compose --env-file .env.dev -f docker-compose.dev.yml up --build
name: crisp-qes-dev

services:
  # anvil + Enclave + CRISPQES{Program,Verifier} + 3 ciphernodes/DKG +
  # coordination-server + program-server, under one supervisor.
  fhe:
    build:
      context: ./vendor/crisp-qes-enclave
      dockerfile: examples/CRISP/fly-operator/Dockerfile
    ports:
      - "8545:8545"   # anvil JSON-RPC
      - "4000:4000"   # coordination server (/state/lite, /qes/*)
    volumes:
      - fhe-data:/data
    healthcheck:
      # anvil reachable == the chain is up (enough for init + the rest to start;
      # DKG happens later at round-open).
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:'{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"method\\\":\\\"eth_blockNumber\\\",\\\"id\\\":1}'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  # one-shot: deploy EnrollmentRegistry + BallotRegistry at deterministic addrs.
  init:
    image: ghcr.io/foundry-rs/foundry:latest
    # Run as container-root so forge can write its cache/out into the bind-mounted
    # contracts dir. Under rootless podman, container-root maps to the host user,
    # so the artifacts are owned by you on the host (gitignored anyway).
    user: "0:0"
    depends_on:
      fhe:
        condition: service_healthy
    env_file: .env.dev
    environment:
      RPC_URL: http://fhe:8545
    entrypoint: ["bash", "/scripts/init.sh"]
    volumes:
      # :ro,z — read-only + SELinux relabel (Fedora/podman). init copies contracts
      # to a writable /tmp before building, so the mount needs no write access.
      - ./packages/contracts:/contracts:ro,z
      - ./scripts/compose:/scripts:ro,z
    restart: "no"

  # enrollment OPRF threshold service (default real-Diia gate; ?root historical path).
  oprf:
    build:
      context: ./packages/oprf/v3-grumpkin
      dockerfile: Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env.dev
    environment:
      NODE_ENV: development           # uses dev V3_THRESHOLD_SEED / V3_ATTESTER_KEY fallbacks
      PORT: "8788"
      HOST: 0.0.0.0
      RPC_URL: http://fhe:8545
      # ENROLLMENT_REGISTRY + CHAIN_ID come from .env.dev
    # podman-compose doesn't enforce init's service_completed_successfully, so oprf
    # may start before the registry exists and exit; restart until init is done.
    restart: unless-stopped
    ports:
      - "8788:8788"

  # submits the attester-signed updateRoot for enrollment.
  relayer:
    build:
      context: .
      dockerfile: packages/relayer/Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env.dev
    environment:
      NODE_ENV: development            # uses anvil[0] as the dev submitter key
      PORT: "8789"
      RPC_URL: http://fhe:8545
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      # ENROLLMENT_REGISTRY + CHAIN_ID from .env.dev
    restart: unless-stopped   # self-heal if it starts before init (see oprf note)
    ports:
      - "8789:8789"

  # the app (Caddy, COOP/COEP) + 128 MiB CRS. VITE_* baked to localhost:<mapped>
  # because the browser runs on the HOST, not inside the compose network.
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_CHAIN_ID: "31337"
        VITE_RPC_URL: http://localhost:8545
        VITE_OPRF_URL: http://localhost:8788
        VITE_RELAYER_URL: http://localhost:8789
        VITE_ENROLLMENT_REGISTRY: ${ENROLLMENT_REGISTRY}
        VITE_OPRF_PUBKEY: ${OPRF_PUBKEY}
        VITE_OPRF_ENROLLMENT_EPOCH: ${OPRF_ENROLLMENT_EPOCH}
        VITE_FHE_OPERATOR_RPC: http://localhost:8545
        VITE_FHE_COORDINATOR_URL: http://localhost:4000
        VITE_FHE_BALLOT_REGISTRY: ${BALLOT_REGISTRY}
        VITE_FHE_CRISP_PROGRAM: ${CRISP_QES_PROGRAM}
        VITE_CIRCUIT_URL: /crisp_qes_v2_circuit.json
        VITE_BLOCK_EXPLORER: http://localhost:8545
        VITE_WALLETCONNECT_PROJECT_ID: "33a263ffda20d72b289cf92b369cfa47"
    environment:
      PORT: "80"
    ports:
      - "8080:80"

volumes:
  fhe-data:
